<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GreenLog - Plantation Drives</title>

    <link rel="stylesheet" href="/style.css?v=2">
</head>

<body>

    <nav class="navbar">

        <div class="logo">🌱 GreenLog</div>

        <div class="nav-links">
            <a href="/">Dashboard</a>
            <a href="/volunteers">Volunteers</a>
            <a href="/plantation-drives">Drives</a>
            <a href="/trees">Trees</a>
            <a href="/check-ins">Check-ins</a>
        </div>

    </nav>

    <main class="container">

        <div class="page-header">
            <h1>Plantation Drives</h1>
        </div>

        <div class="card form-card">

            <h2 class="section-title">Create Plantation Drive</h2>

            <div id="message" class="message"></div>

            <form onsubmit="addDrive(event)">

                <div class="form-group">
                    <label>Drive Name</label>
                    <input type="text" id="name" required>
                </div>

                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="location" required>
                </div>

                <div class="form-group">
                    <label>Drive Date</label>
                    <input type="date" id="driveDate" required>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea id="description"></textarea>
                </div>

                <button class="btn btn-primary" type="submit">
                Create Drive
            </button>

            </form>

        </div>

        <div class="card">

            <h2 class="section-title">
                Plantation Drives
            </h2>

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Location</th>
                        <th>Date</th>
                        <th>Description</th>
                    </tr>

                </thead>

                <tbody id="driveTable"></tbody>

            </table>

        </div>

    </main>

    <script src="/log.js?v=2"></script>

</body>

</html>
