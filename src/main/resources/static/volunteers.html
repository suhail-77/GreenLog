<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GreenLog - Volunteers</title>

    <link rel="stylesheet" href="/style.css?v=2">
</head>

<body>

    <nav class="navbar">

        <div class="logo">🌱 GreenLog</div>

        <div class="nav-links">
            <a href="/">Dashboard</a>
            <a href="/volunteers">Volunteers</a>
            <a href="/plantation-drives">Drives</a>
            <a href="/trees">Trees</a>
            <a href="/check-ins">Check-ins</a>
        </div>

    </nav>

    <main class="container">

        <div class="page-header">
            <h1>Volunteers</h1>
        </div>

        <div class="card form-card">

            <h2 class="section-title">Add Volunteer</h2>

            <div id="message" class="message"></div>

            <form onsubmit="addVolunteer(event)">

                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="name" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="phone">
                </div>

                <button class="btn btn-primary" type="submit">
                Add Volunteer
            </button>

            </form>

        </div>

        <div class="card">

            <h2 class="section-title">
                Registered Volunteers
            </h2>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                    </tr>
                </thead>

                <tbody id="volunteerTable"></tbody>

            </table>

        </div>

    </main>

    <script src="/log.js?v=2"></script>

</body>

</html>
