spring.application.name=greenlog

server.port=8081

# MySQL connection
spring.datasource.url=jdbc:mysql://localhost:3306/greenlog?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Date formatting
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# GreenLog business rule
app.check-in.interval-days=30

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html